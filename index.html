<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>🎬 在线影院</title>
<style>
:root{
  --bg:#0a0a0f;
  --panel:#12121a;
  --card:#1a1a26;
  --card2:#22223a;
  --accent:#e50914;
  --accent2:#ff6b35;
  --blue:#4f8ef7;
  --text:#f0f0f8;
  --muted:#7878a0;
  --border:#2a2a40;
  --radius:12px;
  --gold:#f5c518;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);}
a{text-decoration:none;color:inherit;}

/* ── 滚动条 ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* ── 顶栏 ── */
header{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:16px;
  padding:0 24px;height:58px;
  background:rgba(10,10,15,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.logo{font-size:20px;font-weight:800;letter-spacing:1px;white-space:nowrap;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav{display:flex;gap:6px;margin-left:8px;}
.nav-btn{padding:6px 14px;border-radius:20px;font-size:13px;color:var(--muted);cursor:pointer;border:none;background:none;transition:all .15s;}
.nav-btn:hover,.nav-btn.active{background:var(--card2);color:var(--text);}
.spacer{flex:1;}
.header-search{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--border);
  border-radius:24px;padding:7px 16px;width:220px;
  transition:border-color .2s,width .2s;
}
.header-search:focus-within{border-color:var(--accent);width:280px;}
.header-search input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;}
.header-search input::placeholder{color:var(--muted);}

/* ── 主区域 ── */
main{max-width:1200px;margin:0 auto;padding:24px 16px 60px;}

/* ── 上传区 ── */
.upload-zone{
  border:2px dashed var(--border);
  border-radius:16px;padding:32px;text-align:center;
  cursor:pointer;transition:all .2s;margin-bottom:20px;
  background:linear-gradient(135deg,#1a0a14,#0a0a20);
  position:relative;overflow:hidden;
}
.upload-zone::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%,rgba(229,9,20,.05),transparent 70%);
  pointer-events:none;
}
.upload-zone:hover,.upload-zone.dragover{
  border-color:var(--accent);background:rgba(229,9,20,.06);
}
.upload-zone.dragover{transform:scale(1.01);}
.upload-icon{font-size:40px;margin-bottom:10px;}
.upload-zone h3{font-size:16px;margin-bottom:6px;}
.upload-zone p{font-size:13px;color:var(--muted);}
.upload-zone input{display:none}

/* ── 工具栏 ── */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:16px;
}
.toolbar-left{display:flex;gap:8px;align-items:center;}
.toolbar-right{display:flex;gap:8px;align-items:center;margin-left:auto;}
.toolbar-btn{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:8px;font-size:13px;
  background:var(--card);border:1px solid var(--border);
  color:var(--text);cursor:pointer;transition:all .15s;
}
.toolbar-btn:hover{background:var(--card2);border-color:var(--accent);}
.toolbar-btn.active{background:var(--accent);border-color:var(--accent);}
.view-btn{
  padding:6px 10px;border-radius:8px;
  background:var(--card);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;transition:all .15s;
}
.view-btn:hover,.view-btn.active{background:var(--card2);color:var(--text);}
.view-btn.active{border-color:var(--accent);}

/* ── 分类标签 ── */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.tag{
  padding:7px 16px;border-radius:20px;font-size:13px;
  background:var(--card);border:1px solid var(--border);
  cursor:pointer;transition:all .15s;color:var(--muted);
}
.tag:hover,.tag.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ── 搜索结果区 ── */
.file-count{margin-bottom:14px;font-size:13px;color:var(--muted);}
.file-count span{color:var(--accent);font-weight:700;}

/* ── 网格视图 ── */
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
.file-card{
  background:var(--card);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;
  transition:transform .2s,box-shadow .2s;
  border:1px solid var(--border);
}
.file-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.5);}
.file-thumb{
  position:relative;width:100%;padding-top:120%;
  background:var(--card2);overflow:hidden;
}
.file-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.file-thumb .no-img{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;color:var(--muted);font-size:11px;
}
.file-type-badge{
  position:absolute;top:8px;left:8px;
  background:rgba(0,0,0,.75);color:var(--gold);
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;
}
.file-size-badge{
  position:absolute;top:8px;right:8px;
  background:rgba(0,0,0,.75);color:var(--muted);
  font-size:10px;padding:2px 7px;border-radius:4px;
}
.file-info{padding:10px 12px;}
.file-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-meta{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── 列表视图 ── */
.file-list{display:flex;flex-direction:column;gap:6px;}
.file-list-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:10px;
  background:var(--card);border:1px solid var(--border);
  cursor:pointer;transition:background .15s;
}
.file-list-item:hover{background:var(--card2);}
.file-list-icon{font-size:28px;flex-shrink:0;}
.file-list-info{flex:1;min-width:0;}
.file-list-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-list-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.file-list-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s;}
.file-list-item:hover .file-list-actions{opacity:1;}
.icon-btn{
  background:none;border:none;color:var(--muted);cursor:pointer;
  padding:5px;border-radius:6px;font-size:13px;
  transition:all .15s;display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:rgba(255,255,255,.1);color:var(--text);}
.icon-btn.danger:hover{color:var(--accent);}

/* ── 右键菜单 ── */
.ctx-menu{
  position:fixed;z-index:500;
  background:rgba(20,20,35,.97);
  border:1px solid var(--border);border-radius:10px;
  padding:6px 0;min-width:160px;
  box-shadow:0 16px 40px rgba(0,0,0,.6);
  display:none;
}
.ctx-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;font-size:13px;color:var(--text);
  cursor:pointer;transition:background .1s;
}
.ctx-item:hover{background:rgba(255,255,255,.08);}
.ctx-item.danger{color:var(--accent);}
.ctx-sep{height:1px;background:var(--border);margin:4px 0;}

/* ── 重命名弹窗 ── */
.rename-popup{
  position:fixed;inset:0;z-index:400;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);
}
.rename-popup.open{display:flex;}
.rename-box{
  background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:24px;width:360px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}
.rename-box h3{font-size:15px;margin-bottom:14px;}
.rename-box input{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;
  outline:none;margin-bottom:16px;
}
.rename-box input:focus{border-color:var(--accent);}
.rename-box .btns{display:flex;gap:10px;justify-content:flex-end;}
.btn-cancel{
  padding:8px 18px;border-radius:8px;font-size:13px;
  background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer;
}
.btn-confirm{
  padding:8px 18px;border-radius:8px;font-size:13px;
  background:var(--accent);border:none;color:#fff;cursor:pointer;font-weight:700;
}

/* ── 播放器弹窗 ── */
.player-modal{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.95);
  flex-direction:column;
}
.player-modal.open{display:flex;}
.player-topbar{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;background:rgba(0,0,0,.6);flex-shrink:0;
}
.player-title{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn-close-player{
  background:rgba(255,255,255,.1);border:none;color:var(--text);
  border-radius:8px;padding:8px 16px;cursor:pointer;font-size:13px;
  transition:background .15s;
}
.btn-close-player:hover{background:rgba(255,255,255,.2);}
.player-body{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
#movieVideo{width:100%;height:100%;object-fit:contain;}
.player-ctrl{
  background:linear-gradient(transparent,rgba(0,0,0,.9));
  padding:16px 20px 12px;flex-shrink:0;
}
.prog-area{padding:8px 0 4px;cursor:pointer;position:relative;}
.prog-track{height:4px;background:rgba(255,255,255,.2);border-radius:2px;position:relative;overflow:hidden;transition:height .15s;}
.prog-area:hover .prog-track{height:6px;}
.prog-filled{height:100%;background:var(--accent);border-radius:2px;width:0%;pointer-events:none;}
.prog-buffer{position:absolute;top:0;left:0;height:100%;background:rgba(255,255,255,.15);border-radius:2px;width:0%;pointer-events:none;}
.prog-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.6);opacity:0;transition:opacity .15s;pointer-events:none;}
.prog-area:hover .prog-thumb{opacity:1;}
.ctrl-row{display:flex;align-items:center;gap:6px;margin-top:6px;}
.cbtn{background:none;border:none;color:rgba(255,255,255,.8);cursor:pointer;padding:7px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:color .15s,background .15s;font-size:12px;}
.cbtn:hover{color:#fff;background:rgba(255,255,255,.1);}
.cbtn.on{color:var(--accent);}
.pbtn{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;margin:0 4px;}
.pbtn:hover{background:#ff1a27;}
.pbtn:active{transform:scale(.95);}
.time-txt{font-size:12px;color:rgba(255,255,255,.6);white-space:nowrap;font-variant-numeric:tabular-nums;margin:0 6px;}
.sp-sel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;outline:none;}
.vol-wrap{display:flex;align-items:center;gap:6px;}
.vol-range{-webkit-appearance:none;appearance:none;width:70px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);outline:none;cursor:pointer;}
.vol-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer;}

/* ── 收藏/历史 ── */
.history-item,.fav-item{
  display:flex;align-items:center;gap:14px;
  padding:12px 16px;border-radius:10px;
  background:var(--card);border:1px solid var(--border);
  margin-bottom:8px;cursor:pointer;
  transition:background .15s;
}
.history-item:hover,.fav-item:hover{background:var(--card2);}
.history-url,.fav-url{font-size:13px;color:var(--blue);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.history-time{font-size:11px;color:var(--muted);white-space:nowrap;}
.btn-del{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:4px;}
.btn-del:hover{color:var(--accent);}
.empty-state{text-align:center;padding:50px;color:var(--muted);font-size:14px;}
.empty-state svg{display:block;margin:0 auto 12px;opacity:.3;}

/* ── Toast ── */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(30,30,50,.95);border:1px solid var(--border);
  color:var(--text);padding:10px 22px;border-radius:10px;
  font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:999;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── 空状态占位 ── */
.no-files{
  text-align:center;padding:48px 24px;
  border:2px dashed var(--border);border-radius:16px;
  color:var(--muted);
}
.no-files-icon{font-size:48px;margin-bottom:12px;opacity:.4;}
.no-files p{font-size:14px;line-height:1.8;}

/* ── 移动端适配 ── */
@media(max-width:700px){
  header{padding:0 14px;}
  .header-search{width:160px;}
  .header-search:focus-within{width:180px;}
  .nav{display:none;}
  main{padding:16px 12px 60px;}
  .file-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
  .toolbar{flex-direction:column;align-items:flex-start;}
  .toolbar-right{margin-left:0;}
  .player-ctrl{padding:12px 12px 8px;}
  .vol-range{width:50px;}
  .sp-sel{display:none;}
}
</style>
</head>
<body>

<!-- 顶栏 -->
<header>
  <div class="logo">🎬 CinePlay</div>
  <nav class="nav">
    <button class="nav-btn active" onclick="switchPage('home',this)">我的文件</button>
    <button class="nav-btn" onclick="switchPage('fav',this)">收藏</button>
    <button class="nav-btn" onclick="switchPage('history',this)">历史</button>
  </nav>
  <div class="spacer"></div>
  <div class="header-search">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" placeholder="搜索文件名..." id="globalSearch"/>
  </div>
</header>

<!-- 播放器弹窗 -->
<div class="player-modal" id="playerModal">
  <div class="player-topbar">
    <button class="btn-close-player" onclick="closePlayer()">✕ 关闭</button>
    <div class="player-title" id="playerTitle">正在播放</div>
    <button class="cbtn" id="btnFavPlayer" onclick="toggleFavCurrent()" title="收藏">
      <svg id="favIconEmpty" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <svg id="favIconFilled" width="18" height="18" viewBox="0 0 24 24" fill="var(--accent)" stroke="var(--accent)" stroke-width="2" style="display:none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
    <button class="cbtn" id="btnPip2" style="margin-left:auto">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="12" y="10" width="8" height="5" rx="1"/></svg>
    </button>
    <button class="cbtn" id="btnFs2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    </button>
  </div>
  <div class="player-body" id="playerBody">
    <video id="movieVideo" preload="metadata" playsinline></video>
  </div>
  <div class="player-ctrl" id="playerCtrl">
    <div class="prog-area" id="progArea">
      <div class="prog-track">
        <div class="prog-buffer" id="progBuffer"></div>
        <div class="prog-filled" id="progFilled"></div>
      </div>
      <div class="prog-thumb" id="progThumb"></div>
    </div>
    <div class="ctrl-row">
      <button class="pbtn" id="btnPlayPause">
        <svg id="ic-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="ic-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <span class="time-txt" id="timeTxt">0:00 / 0:00</span>
      <div style="flex:1"></div>
      <select class="sp-sel" id="spSel">
        <option value=".5">0.5x</option><option value=".75">0.75x</option>
        <option value="1" selected>1.0x</option><option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option><option value="2">2.0x</option>
      </select>
      <div class="vol-wrap">
        <button class="cbtn" id="btnMute2">
          <svg id="ic-vol" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <svg id="ic-muted" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
        <input type="range" class="vol-range" id="volRange" min="0" max="1" step=".02" value="1"/>
      </div>
    </div>
  </div>
</div>

<!-- 右键菜单 -->
<div class="ctx-menu" id="ctxMenu">
  <div class="ctx-item" onclick="ctxAction('open')">▶ 打开 / 预览</div>
  <div class="ctx-item" onclick="ctxAction('download')">⬇ 下载</div>
  <div class="ctx-item" onclick="ctxAction('copy')">📋 复制名称</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" onclick="ctxAction('rename')">✏ 重命名</div>
  <div class="ctx-item danger" onclick="ctxAction('delete')">🗑 删除</div>
</div>

<!-- 重命名弹窗 -->
<div class="rename-popup" id="renamePopup">
  <div class="rename-box">
    <h3>✏ 重命名文件</h3>
    <input type="text" id="renameInput" placeholder="输入新名称"/>
    <div class="btns">
      <button class="btn-cancel" onclick="closeRename()">取消</button>
      <button class="btn-confirm" onclick="confirmRename()">确认</button>
    </div>
  </div>
</div>

<!-- 主内容 -->
<main id="mainContent">

  <!-- 我的文件页 -->
  <div id="pageHome">
    <!-- 上传区 -->
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📂</div>
      <h3>拖拽文件到此处上传</h3>
      <p>或点击选择文件 · 支持文档、图片、视频、音频、压缩包等</p>
      <input type="file" id="fileInput" multiple onchange="handleFileSelect(this.files)"/>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="toolbar-left">
        <!-- 分类 -->
        <div class="tags" id="categoryTags">
          <div class="tag active" onclick="filterCat('全部',this)" data-cat="全部">全部</div>
          <div class="tag" onclick="filterCat('图片',this)" data-cat="图片">📷 图片</div>
          <div class="tag" onclick="filterCat('视频',this)" data-cat="视频">🎬 视频</div>
          <div class="tag" onclick="filterCat('音频',this)" data-cat="音频">🎵 音频</div>
          <div class="tag" onclick="filterCat('文档',this)" data-cat="文档">📄 文档</div>
          <div class="tag" onclick="filterCat('压缩包',this)" data-cat="压缩包">📦 压缩包</div>

<script>
// ══════════════════════════════════
// IndexedDB 存储
// ══════════════════════════════════
const DB_NAME = 'CinePlayDB';
const DB_VERSION = 1;
const STORE_NAME = 'files';
let db = null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const database = e.target.result;
      if(!database.objectStoreNames.contains(STORE_NAME)){
        database.createObjectStore(STORE_NAME, {keyPath:'id', autoIncrement:true});
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbAdd(file, blob){
  return new Promise(async (resolve,reject)=>{
    if(!db) db = await openDB();
    const tx = db.transaction(STORE_NAME,'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.add({
      name: file.name,
      type: file.type,
      size: file.size,
      lastModified: file.lastModified,
      blob: blob,
      createdAt: Date.now()
    });
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbGetAll(){
  return new Promise(async (resolve,reject)=>{
    if(!db) db = await openDB();
    const tx = db.transaction(STORE_NAME,'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = e => resolve(e.target.result||[]);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbDelete(id){
  return new Promise(async (resolve,reject)=>{
    if(!db) db = await openDB();
    const tx = db.transaction(STORE_NAME,'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.delete(id);
    req.onsuccess = ()=>resolve(); req.onerror = e=>reject(e.target.error);
  });
}

async function dbUpdate(id, name){
  return new Promise(async (resolve,reject)=>{
    if(!db) db = await openDB();
    const tx = db.transaction(STORE_NAME,'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.get(id);
    req.onsuccess = e=>{
      const rec = e.target.result;
      if(rec){ rec.name=name; store.put(rec); }
      resolve();
    };
    req.onerror = e=>reject(e.target.error);
  });
}

// ══════════════════════════════════
// 文件分类
// ══════════════════════════════════
const TYPE_MAP = {
  'image/':'图片',
  'video/':'视频',
  'audio/':'音频',
  'application/pdf':'文档','application/msword':'文档',
  'application/vnd':'文档','text/':'文档',
  'application/zip':'压缩包','application/x-zip':'压缩包',
  'application/x-rar':'压缩包','application/vnd.rar':'压缩包',
  'application/x-7z':'压缩包',
};
function getFileCat(type, name){
  for(const k in TYPE_MAP){
    if(type.startsWith(k)) return TYPE_MAP[k];
  }
  const ext = name.split('.').pop().toLowerCase();
  const extMap = {
    jpg:'图片',jpeg:'图片',png:'图片',gif:'图片',webp:'图片',bmp:'图片',svg:'图片',ico:'图片',
    mp4:'视频',webm:'视频',avi:'视频',mkv:'视频',mov:'视频',m4v:'视频',flv:'视频',ts:'视频',wmv:'视频',
    mp3:'音频',wav:'音频',ogg:'音频',flac:'音频',aac:'音频',wma:'音频',m4a:'音频',
    pdf:'文档',doc:'文档',docx:'文档',xls:'文档',xlsx:'文档',ppt:'文档',pptx:'文档',txt:'文档',md:'文档',
    zip:'压缩包',rar:'压缩包','7z':'压缩包',tar:'压缩包',gz:'压缩包',
  };
  return extMap[ext]||'其他';
}

function getFileIcon(file){
  const cat = getFileCat(file.type||'', file.name);
  const icons = {
    '图片':'🖼️','视频':'🎬','音频':'🎵',
    '文档':'📄','压缩包':'📦','其他':'📁'
  };
  return icons[cat]||'📁';
}

function getFileExt(name){
  return name.split('.').pop().toLowerCase();
}

function formatSize(bytes){
  if(bytes<1024) return bytes+' B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+' KB';
  if(bytes<1024*1024*1024) return (bytes/1024/1024).toFixed(1)+' MB';
  return (bytes/1024/1024/1024).toFixed(2)+' GB';
}

function formatDate(ts){
  const d = new Date(ts);
  const y = d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// ══════════════════════════════════
// 状态
// ══════════════════════════════════
let allFiles = [];
let filteredFiles = [];
let currentCat = '全部';
let currentView = 'grid';
let searchQuery = '';
let ctxFile = null;
let currentPlayingFile = null;

// ══════════════════════════════════
// 上传
// ══════════════════════════════════
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('dragover',e=>{e.preventDefault();uploadZone.classList.add('dragover');});
uploadZone.addEventListener('dragleave',e=>{e.preventDefault();uploadZone.classList.remove('dragover');});
uploadZone.addEventListener('drop',e=>{
  e.preventDefault();uploadZone.classList.remove('dragover');
  handleFileSelect(e.dataTransfer.files);
});

async function handleFileSelect(files){
  if(!files||!files.length) return;
  let added=0;
  for(const f of files){
    const blob = f.slice(0, f.size, f.type);
    await dbAdd(f, blob);
    added++;
  }
  showToast(`已上传 ${added} 个文件`);
  await loadFiles();
}

// ══════════════════════════════════
// 加载文件
// ══════════════════════════════════
async function loadFiles(){
  allFiles = await dbGetAll();
  applyFilters();
}

// ══════════════════════════════════
// 筛选与排序
// ══════════════════════════════════
function applyFilters(){
  let list = [...allFiles];

  // 分类
  if(currentCat!=='全部'){
    list = list.filter(f=>getFileCat(f.type||'',f.name)===currentCat);
  }

  // 搜索
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    list = list.filter(f=>f.name.toLowerCase().includes(q));
  }

  // 排序
  const sort = document.getElementById('sortSelect').value;
  if(sort==='time-desc') list.sort((a,b)=>b.createdAt-a.createdAt);
  else if(sort==='time-asc') list.sort((a,b)=>a.createdAt-b.createdAt);
  else if(sort==='name-asc') list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='name-desc') list.sort((a,b)=>b.name.localeCompare(a.name));
  else if(sort==='size-desc') list.sort((a,b)=>b.size-a.size);
  else if(sort==='size-asc') list.sort((a,b)=>a.size-b.size);

  filteredFiles = list;
  renderFiles();
}

function filterCat(cat, el){
  currentCat = cat;
  document.querySelectorAll('#categoryTags .tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function setView(view){
  currentView = view;
  document.getElementById('btnGridView').classList.toggle('active', view==='grid');
  document.getElementById('btnListView').classList.toggle('active', view==='list');
  renderFiles();
}

// ══════════════════════════════════
// 渲染文件
// ══════════════════════════════════
function renderFiles(){
  const area = document.getElementById('fileArea');
  const count = document.getElementById('fileCount');

  if(filteredFiles.length===0){
    count.innerHTML='';
    area.innerHTML=`
      <div class="no-files">
        <div class="no-files-icon">📂</div>
        <p>${allFiles.length===0?'还没有上传任何文件<br>拖拽或点击上方区域即可上传':'该分类下没有文件'}</p>
      </div>`;
    return;
  }

  count.innerHTML=`共 <span>${filteredFiles.length}</span> 个文件`;
  if(currentView==='grid') renderGrid(area);
  else renderList(area);
}

function renderGrid(container){
  container.className='file-grid';
  container.innerHTML='';
  filteredFiles.forEach(f=>{
    const cat = getFileCat(f.type||'',f.name);
    const icon = getFileIcon(f);
    const url = URL.createObjectURL(f.blob);
    const isImg = cat==='图片';

    const card = document.createElement('div');
    card.className='file-card';
    card.innerHTML=`
      <div class="file-thumb">
        ${isImg?`<img src="${url}" loading="lazy">`:`<div class="no-img"><span style="font-size:36px">${icon}</span></div>`}
        <div class="file-type-badge">${cat}</div>
        <div class="file-size-badge">${formatSize(f.size)}</div>
      </div>
      <div class="file-info">
        <div class="file-name" title="${f.name}">${f.name}</div>
        <div class="file-meta">${formatDate(f.createdAt)}</div>
      </div>`;
    card.onclick = ()=>openFile(f,url,cat);
    card.oncontextmenu = (e)=>showCtx(e,f);
    container.appendChild(card);
  });
}

function renderList(container){
  container.className='file-list';
  container.innerHTML='';
  filteredFiles.forEach(f=>{
    const cat = getFileCat(f.type||'',f.name);
    const icon = getFileIcon(f);
    const url = URL.createObjectURL(f.blob);

    const item = document.createElement('div');
    item.className='file-list-item';
    item.innerHTML=`
      <div class="file-list-icon">${icon}</div>
      <div class="file-list-info">
        <div class="file-list-name" title="${f.name}">${f.name}</div>
        <div class="file-list-meta">${cat} · ${formatSize(f.size)} · ${formatDate(f.createdAt)}</div>
      </div>
      <div class="file-list-actions">
        <button class="icon-btn" onclick="event.stopPropagation();openFile(f${f.id},'${url}','${cat}')" title="打开">▶</button>
        <button class="icon-btn" onclick="event.stopPropagation();downloadFile(f${f.id})" title="下载">⬇</button>
        <button class="icon-btn danger" onclick="event.stopPropagation();deleteFile(f${f.id})" title="删除">🗑</button>
      </div>`;
    // 修正onclick参数
    item.querySelector('[title="打开"]').onclick = (e)=>{e.stopPropagation();openFile(f,url,cat);};
    item.querySelector('[title="下载"]').onclick = (e)=>{e.stopPropagation();downloadFile(f);};
    item.querySelector('[title="删除"]').onclick = (e)=>{e.stopPropagation();deleteFile(f);};
    item.onclick = ()=>openFile(f,url,cat);
    item.oncontextmenu = (e)=>showCtx(e,f);
    container.appendChild(item);
  });
}

// ══════════════════════════════════
// 打开文件
// ══════════════════════════════════
function openFile(f, url, cat){
  // 保存历史
  saveHistory(f);
  // 判断类型预览
  if(cat==='图片'){
    // 图片直接新窗口打开
    window.open(url,'_blank');
  } else if(cat==='视频'||cat==='音频'){
    currentPlayingFile = f;
    playLocalMedia(url, f.name, cat==='音频');
  } else {
    // 其他下载
    downloadFile(f);
    showToast('该类型不支持预览，已开始下载');
  }
}

function playLocalMedia(url, title, isAudio=false){
  const modal = document.getElementById('playerModal');
  const video = document.getElementById('movieVideo');
  const ctrl = document.getElementById('playerCtrl');
  modal.classList.add('open');
  document.body.style.overflow='hidden';
  document.getElementById('playerTitle').textContent = title;

  if(isAudio){
    video.style.display='block';
    video.style.width='0';video.style.height='0';
    ctrl.style.display='none';
  } else {
    video.style.display='block';
    video.style.width='100%';video.style.height='100%';
    ctrl.style.display='';
  }
  video.src=url;
  video.load();
  video.play().catch(()=>{});

  // 更新收藏图标
  updateFavIcon();
}

function updateFavIcon(){
  const empty = document.getElementById('favIconEmpty');
  const filled = document.getElementById('favIconFilled');
  if(!currentPlayingFile) return;
  const isFav = getFavList().some(f=>f.id===currentPlayingFile.id);
  empty.style.display=isFav?'none':'';
  filled.style.display=isFav?'':'none';
}

function toggleFavCurrent(){
  if(!currentPlayingFile) return;
  toggleFavRecord(currentPlayingFile);
  updateFavIcon();
}

function closePlayer(){
  const modal = document.getElementById('playerModal');
  const video = document.getElementById('movieVideo');
  modal.classList.remove('open');
  document.body.style.overflow='';
  video.pause();video.src='';
  currentPlayingFile=null;
}

// ══════════════════════════════════
// 下载
// ══════════════════════════════════
function downloadFile(f){
  const url = URL.createObjectURL(f.blob);
  const a = document.createElement('a');
  a.href=url; a.download=f.name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// ══════════════════════════════════
// 右键菜单
// ══════════════════════════════════
function showCtx(e, f){
  e.preventDefault();
  ctxFile=f;
  const menu=document.getElementById('ctxMenu');
  menu.style.display='block';
  const x=e.clientX, y=e.clientY;
  menu.style.left=(x+menu.offsetWidth>window.innerWidth?x-menu.offsetWidth:x)+'px';
  menu.style.top=(y+menu.offsetHeight>window.innerHeight?y-menu.offsetHeight:y)+'px';
}

function hideCtx(){
  document.getElementById('ctxMenu').style.display='none';
}
document.addEventListener('click',hideCtx);

function ctxAction(action){
  if(!ctxFile) return;
  const url=URL.createObjectURL(ctxFile.blob);
  const cat=getFileCat(ctxFile.type||'',ctxFile.name);
  if(action==='open'){ openFile(ctxFile,url,cat); }
  else if(action==='download'){ downloadFile(ctxFile); }
  else if(action==='copy'){ navigator.clipboard.writeText(ctxFile.name).then(()=>showToast('已复制名称')); }
  else if(action==='rename'){ openRename(ctxFile); }
  else if(action==='delete'){ deleteFile(ctxFile); }
  hideCtx();
}

// ══════════════════════════════════
// 重命名
// ══════════════════════════════════
function openRename(f){
  ctxFile=f;
  const inp=document.getElementById('renameInput');
  inp.value=f.name;
  document.getElementById('renamePopup').classList.add('open');
  setTimeout(()=>inp.focus(),50);
}
function closeRename(){
  document.getElementById('renamePopup').classList.remove('open');
  ctxFile=null;
}
async function confirmRename(){
  const inp=document.getElementById('renameInput');
  const newName=inp.value.trim();
  if(!newName||!ctxFile) return;
  await dbUpdate(ctxFile.id, newName);
  showToast('已重命名');
  closeRename();
  await loadFiles();
}
document.getElementById('renameInput').addEventListener('keydown',e=>{
  if(e.key==='Enter') confirmRename();
  if(e.key==='Escape') closeRename();
});

// ══════════════════════════════════
// 删除
// ══════════════════════════════════
async function deleteFile(f){
  if(!confirm(`确定删除「${f.name}」吗？`)) return;
  await dbDelete(f.id);
  showToast('已删除');
  await loadFiles();
}

// ══════════════════════════════════
// 收藏（localStorage）
// ══════════════════════════════════
function getFavList(){
  return JSON.parse(localStorage.getItem('cineplay_fav')||'[]');
}
function saveFavList(list){
  localStorage.setItem('cineplay_fav',JSON.stringify(list));
}
function toggleFavRecord(f){
  const list=getFavList();
  const idx=list.findIndex(x=>x.id===f.id);
  if(idx>=0){ list.splice(idx,1); showToast('已取消收藏'); }
  else { list.push({id:f.id,name:f.name,type:f.type,size:f.size,cat:getFileCat(f.type||'',f.name)}); showToast('❤️ 已收藏'); }
  saveFavList(list);
}
function clearFav(){ saveFavList([]); renderFav(); showToast('已清空收藏'); }

function renderFav(){
  const el=document.getElementById('favList');
  const list=getFavList();
  document.getElementById('favCount').textContent=`${list.length} 个收藏`;
  if(!list.length){
    el.innerHTML=`<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><p>暂无收藏</p></div>`; return;
  }
  el.innerHTML=list.map((f,i)=>`
    <div class="fav-item">
      <span style="font-size:22px">${getFileIcon({type:f.type||'',name:f.name})}</span>
      <span class="fav-url">${f.name}</span>
      <button class="btn-del" onclick="event.stopPropagation();delFavItem(${i})">✕</button>
    </div>`).join('');
  el.querySelectorAll('.fav-item').forEach((item,i)=>{
    item.onclick=()=>{
      const fav=getFavList()[i];
      if(!fav) return;
      dbGetAll().then(all=>{
        const found=all.find(x=>x.id===fav.id);
        if(found){
          const url=URL.createObjectURL(found.blob);
          const cat=getFileCat(found.type||'',found.name);
          openFile(found,url,cat);
        } else { showToast('文件已被删除'); }
      });
    };
  });
}
function delFavItem(idx){
  const list=getFavList(); list.splice(idx,1); saveFavList(list);
  renderFav(); showToast('已取消收藏');
}

// ══════════════════════════════════
// 历史（localStorage）
// ══════════════════════════════════
function saveHistory(f){
  let list=JSON.parse(localStorage.getItem('cineplay_hist')||'[]');
  list=list.filter(x=>x.id!==f.id);
  list.unshift({id:f.id,name:f.name,type:f.type,size:f.size,cat:getFileCat(f.type||'',f.name),time:new Date().toLocaleString('zh-CN')});
  if(list.length>50) list.pop();
  localStorage.setItem('cineplay_hist',JSON.stringify(list));
}
function clearHistory(){ localStorage.setItem('cineplay_hist','[]'); renderHistory(); showToast('已清空历史'); }

function renderHistory(){
  const el=document.getElementById('historyList');
  const list=JSON.parse(localStorage.getItem('cineplay_hist')||'[]');
  document.getElementById('histCount').textContent=`${list.length} 条记录`;
  if(!list.length){
    el.innerHTML=`<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><p>暂无播放历史</p></div>`; return;
  }
  el.innerHTML=list.map((h,i)=>`
    <div class="history-item">
      <span style="font-size:22px">${getFileIcon({type:h.type||'',name:h.name})}</span>
      <span class="history-url">${h.name}</span>
      <span class="history-time">${h.time}</span>
      <button class="btn-del" onclick="event.stopPropagation();delHistItem(${i})">✕</button>
    </div>`).join('');
  el.querySelectorAll('.history-item').forEach((item,i)=>{
    item.onclick=()=>{
      dbGetAll().then(all=>{
        const found=all.find(x=>x.id===list[i].id);
        if(found){
          const url=URL.createObjectURL(found.blob);
          openFile(found,url,getFileCat(found.type||'',found.name));
        } else { showToast('文件已被删除'); }
      });
    };
  });
}
function delHistItem(idx){
  let list=JSON.parse(localStorage.getItem('cineplay_hist')||'[]');
  list.splice(idx,1); localStorage.setItem('cineplay_hist',JSON.stringify(list));
  renderHistory();
}

// ══════════════════════════════════
// 播放器控制
// ══════════════════════════════════
const btnPP=document.getElementById('btnPlayPause');
const icPlay=document.getElementById('ic-play');
const icPause=document.getElementById('ic-pause');
const movieVideo=document.getElementById('movieVideo');
const progArea=document.getElementById('progArea');
const progFilled=document.getElementById('progFilled');
const progBuffer=document.getElementById('progBuffer');
const progThumb=document.getElementById('progThumb');
const timeTxt=document.getElementById('timeTxt');
const volRange=document.getElementById('volRange');
const spSel=document.getElementById('spSel');

function fmt(s){
  if(isNaN(s)) return '0:00';
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60);
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${m}:${String(sec).padStart(2,'0')}`;
}
btnPP.addEventListener('click',()=>{ if(movieVideo.paused) movieVideo.play(); else movieVideo.pause(); });
movieVideo.addEventListener('play',()=>{ icPlay.style.display='none'; icPause.style.display=''; });
movieVideo.addEventListener('pause',()=>{ icPlay.style.display=''; icPause.style.display='none'; });
movieVideo.addEventListener('timeupdate',()=>{
  if(!movieVideo.duration) return;
  const p=movieVideo.currentTime/movieVideo.duration*100;
  progFilled.style.width=p+'%'; progThumb.style.left=p+'%';
  timeTxt.textContent=fmt(movieVideo.currentTime)+' / '+fmt(movieVideo.duration);
});
movieVideo.addEventListener('progress',()=>{
  if(movieVideo.buffered.length>0&&movieVideo.duration)
    progBuffer.style.width=(movieVideo.buffered.end(movieVideo.buffered.length-1)/movieVideo.duration*100)+'%';
});
let seekDrag=false;
progArea.addEventListener('mousedown',e=>{seekDrag=true;seekTo(e);});
document.addEventListener('mousemove',e=>{if(seekDrag)seekTo(e);});
document.addEventListener('mouseup',()=>seekDrag=false);
function seekTo(e){
  if(!movieVideo.duration) return;
  const r=progArea.getBoundingClientRect();
  const p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  movieVideo.currentTime=p*movieVideo.duration;
}
volRange.addEventListener('input',()=>{ movieVideo.volume=parseFloat(volRange.value); movieVideo.muted=movieVideo.volume===0; updateVolIcon(); });
document.getElementById('btnMute2').addEventListener('click',()=>{ movieVideo.muted=!movieVideo.muted; updateVolIcon(); });
function updateVolIcon(){
  const m=movieVideo.muted||movieVideo.volume===0;
  document.getElementById('ic-vol').style.display=m?'none':'';
  document.getElementById('ic-muted').style.display=m?'':'none';
}
spSel.addEventListener('change',()=>movieVideo.playbackRate=parseFloat(spSel.value));
document.getElementById('btnFs2').addEventListener('click',()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.getElementById('playerBody').requestFullscreen();
});
document.getElementById('btnPip2').addEventListener('click',async()=>{
  if(!movieVideo.src) return;
  try{
    if(document.pictureInPictureElement) await document.exitPictureInPicture();
    else await movieVideo.requestPictureInPicture();
  }catch(e){}
});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('playerModal').classList.contains('open')) return;
  if(e.target.tagName==='INPUT') return;
  switch(e.key){
    case ' ': e.preventDefault(); btnPP.click(); break;
    case 'ArrowRight': movieVideo.currentTime=Math.min(movieVideo.duration,movieVideo.currentTime+5); break;
    case 'ArrowLeft': movieVideo.currentTime=Math.max(0,movieVideo.currentTime-5); break;
    case 'Escape': closePlayer(); break;
  }
});

// ══════════════════════════════════
// 搜索
// ══════════════════════════════════
document.getElementById('globalSearch').addEventListener('input',function(){
  searchQuery=this.value.trim();
  applyFilters();
});

// ══════════════════════════════════
// 页面切换
// ══════════════════════════════════
function switchPage(page, btn){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('pageHome').style.display=page==='home'?'':'none';
  document.getElementById('pageFav').style.display=page==='fav'?'':'none';
  document.getElementById('pageHistory').style.display=page==='history'?'':'none';
  if(page==='fav') renderFav();
  if(page==='history') renderHistory();
}

// ══════════════════════════════════
// Toast
// ══════════════════════════════════
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

// ══════════════════════════════════
// 初始化
// ══════════════════════════════════
(async()=>{
  await loadFiles();
})();
</script>
