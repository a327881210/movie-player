<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>资料库</title>
  <style>
    :root {
      --bg: #0f0f13;
      --panel: #1a1a22;
      --card: #22222e;
      --card-hover: #2a2a3a;
      --accent: #6c63ff;
      --accent2: #ff6b6b;
      --text: #e8e8f0;
      --muted: #7a7a9a;
      --border: #2d2d3e;
      --success: #4ade80;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── 顶栏 ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 56px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
    }
    .logo svg { color: var(--accent); }

    .search-wrap {
      flex: 1;
      max-width: 480px;
      margin: 0 24px;
    }
    .search-bar {
      display: flex;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 6px 16px;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .search-bar:focus-within { border-color: var(--accent); }
    .search-bar input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      width: 100%;
    }
    .search-bar input::placeholder { color: var(--muted); }

    .header-actions { display: flex; gap: 10px; align-items: center; }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:hover { background: #7c74ff; transform: scale(1.02); }
    .btn-primary:active { transform: scale(0.97); }

    .btn-ghost {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .btn-ghost:hover { background: var(--card-hover); color: var(--text); }

    /* ── 统计栏 ── */
    .stats-bar {
      display: flex;
      gap: 0;
      padding: 16px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      padding: 0 24px;
      border-right: 1px solid var(--border);
    }
    .stat-item:first-child { padding-left: 0; }
    .stat-item:last-child { border-right: none; }
    .stat-num { font-size: 22px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 1px; }

    /* ── 标签筛选 ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 24px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }
    .filter-bar::-webkit-scrollbar { height: 0; }
    .filter-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      transition: all 0.15s;
    }
    .filter-tag:hover { border-color: var(--accent); color: var(--accent); }
    .filter-tag.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .filter-tag .count {
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 1px 6px;
      font-size: 10px;
    }
    .filter-tag.active .count { background: rgba(255,255,255,0.25); }

    /* ── 主区域 ── */
    .main-content {
      padding: 20px 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── 上传区域 ── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      transition: all 0.2s;
      cursor: pointer;
      margin-bottom: 24px;
      background: var(--panel);
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(108,99,255,0.05);
    }
    .upload-zone-icon { font-size: 48px; margin-bottom: 16px; }
    .upload-zone h3 { font-size: 16px; margin-bottom: 8px; }
    .upload-zone p { font-size: 13px; color: var(--muted); }
    .upload-zone .hint { font-size: 11px; color: var(--muted); margin-top: 10px; }

    /* ── 排序/视图切换 ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .toolbar-left { font-size: 13px; color: var(--muted); }
    .toolbar-right { display: flex; gap: 8px; align-items: center; }
    .sort-select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    .view-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .view-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── 文件网格 ── */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .file-grid.list-view {
      grid-template-columns: 1fr;
      gap: 6px;
    }

    /* ── 文件卡片 ── */
    .file-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .file-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(108,99,255,0.15);
    }
    .file-card.selected {
      border-color: var(--accent);
      background: rgba(108,99,255,0.08);
    }

    /* 缩略图区 */
    .file-thumb {
      height: 140px;
      background: linear-gradient(135deg, #1e1e2e, #2a2a3a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      position: relative;
      overflow: hidden;
    }
    .file-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .file-thumb .ext-badge {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .file-thumb .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .file-card:hover .play-overlay { opacity: 1; }
    .file-thumb .play-overlay span {
      background: var(--accent);
      border-radius: 50%;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-size: 18px;
    }

    /* 复选框 */
    .file-check {
      position: absolute;
      top: 8px; left: 8px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: all 0.15s;
      z-index: 2;
    }
    .file-card:hover .file-check,
    .file-card.selected .file-check { opacity: 1; }
    .file-card.selected .file-check {
      background: var(--accent);
      border-color: var(--accent);
    }
    .file-check svg { width: 12px; height: 12px; color: #fff; display: none; }
    .file-card.selected .file-check svg { display: block; }

    /* 文件信息 */
    .file-info {
      padding: 12px;
    }
    .file-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    .file-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }
    .file-size { color: var(--muted); }
    .file-date { font-size: 10px; color: var(--muted); }

    /* 列表视图样式 */
    .file-grid.list-view .file-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      border-radius: 8px;
    }
    .file-grid.list-view .file-thumb {
      width: 52px; height: 52px;
      border-radius: 8px;
      margin: 8px 0 8px 8px;
      flex-shrink: 0;
      font-size: 24px;
    }
    .file-grid.list-view .file-info {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .file-grid.list-view .file-name { flex: 1; margin-bottom: 0; }
    .file-grid.list-view .file-meta { flex-shrink: 0; }
    .file-grid.list-view .ext-badge { display: none; }

    /* ── 右键菜单 ── */
    .context-menu {
      position: fixed;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 0;
      min-width: 160px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      z-index: 1000;
      display: none;
    }
    .context-menu.show { display: block; }
    .context-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.1s;
      color: var(--text);
    }
    .context-item:hover { background: var(--card-hover); }
    .context-item.danger { color: #ff6b6b; }
    .context-item.danger:hover { background: rgba(255,107,107,0.1); }
    .context-divider { height: 1px; background: var(--border); margin: 4px 0; }

    /* ── 预览面板 ── */
    .preview-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .preview-overlay.show { display: flex; }
    .preview-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .preview-title { font-size: 14px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview-actions { display: flex; gap: 10px; }
    .preview-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 20px;
    }
    .preview-body img { max-width: 100%; max-height: calc(100vh - 140px); border-radius: 8px; object-fit: contain; }
    .preview-body video, .preview-body audio { max-width: 100%; width: 100%; }
    .preview-body iframe { width: 100%; height: calc(100vh - 140px); border: none; }
    .preview-no-support {
      color: var(--muted);
      text-align: center;
      padding: 40px;
    }
    .preview-no-support p { margin-bottom: 16px; }
    .preview-info {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      gap: 24px;
      font-size: 12px;
      color: var(--muted);
    }
    .preview-info span b { color: var(--text); margin-left: 6px; }

    /* ── 上传进度 ── */
    .upload-progress {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
      display: none;
    }
    .upload-progress.show { display: block; }
    .upload-progress-name { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .upload-progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .upload-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #a89fff); border-radius: 3px; width: 0%; transition: width 0.3s; }

    /* ── 空状态 ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty-state svg { opacity: 0.2; margin-bottom: 16px; }
    .empty-state h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); }
    .empty-state p { font-size: 13px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      z-index: 999;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; pointer-events: auto; }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--accent2); }

    /* ── 动画 ── */
    @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: none; } }
    .file-card { animation: fadeIn 0.3s ease; }

    /* ── 滚动条 ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* 移动端 */
    @media (max-width: 600px) {
      .stats-bar { padding: 12px 16px; gap: 0; }
      .stat-item { padding: 0 12px; }
      .stat-num { font-size: 18px; }
      .main-content { padding: 16px; }
      .search-wrap { display: none; }
      header { padding: 0 16px; }
    }
  </style>
</head>
<body>

<!-- 顶栏 -->
<header>
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
      <path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6 10H6v-2h8v2zm4-4H6V8h12v4z"/>
    </svg>
    资料库
  </div>

  <div class="search-wrap">
    <div class="search-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" placeholder="搜索文件..." id="searchInput" oninput="renderFiles()" />
    </div>
  </div>

  <div class="header-actions">
    <button class="btn-ghost" onclick="sortBy='name'; renderFiles()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      名称
    </button>
    <button class="btn-primary" onclick="fileInput.click()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      上传文件
    </button>
  </div>
</header>

<!-- 统计栏 -->
<div class="stats-bar">
  <div class="stat-item"><div class="stat-num" id="statTotal">0</div><div class="stat-label">全部文件</div></div>
  <div class="stat-item"><div class="stat-num" id="statSize">0 MB</div><div class="stat-label">总大小</div></div>
  <div class="stat-item"><div class="stat-num" id="statToday">0</div><div class="stat-label">今日上传</div></div>
</div>

<!-- 标签筛选 -->
<div class="filter-bar">
  <span class="filter-tag active" data-type="all" onclick="setFilter('all', this)">全部 <span class="count" id="cntAll">0</span></span>
  <span class="filter-tag" data-type="doc" onclick="setFilter('doc', this)">📄 文档 <span class="count" id="cntDoc">0</span></span>
  <span class="filter-tag" data-type="image" onclick="setFilter('image', this)">🖼️ 图片 <span class="count" id="cntImg">0</span></span>
  <span class="filter-tag" data-type="video" onclick="setFilter('video', this)">🎬 视频 <span class="count" id="cntVid">0</span></span>
  <span class="filter-tag" data-type="audio" onclick="setFilter('audio', this)">🎵 音频 <span class="count" id="cntAud">0</span></span>
  <span class="filter-tag" data-type="zip" onclick="setFilter('zip', this)">📦 压缩包 <span class="count" id="cntZip">0</span></span>
  <span class="filter-tag" data-type="other" onclick="setFilter('other', this)">📎 其他 <span class="count" id="cntOther">0</span></span>
</div>

<!-- 主区域 -->
<div class="main-content">

  <!-- 上传区 -->
  <div class="upload-zone" id="uploadZone" onclick="fileInput.click()">
    <div class="upload-zone-icon">📂</div>
    <h3>点击上传或将文件拖入此处</h3>
    <p>支持：文档、图片、视频、音频、压缩包等任意文件</p>
    <p class="hint">单个文件最大 500MB · 无数量限制 · 本地存储不上传服务器</p>
  </div>

  <!-- 进度条 -->
  <div class="upload-progress" id="uploadProgress">
    <div class="upload-progress-name">
      <span id="uploadFileName">-</span>
      <span id="uploadPercent" style="color:var(--accent)">0%</span>
    </div>
    <div class="upload-progress-bar"><div class="upload-progress-fill" id="uploadFill"></div></div>
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <div class="toolbar-left" id="toolbarInfo">共 0 个文件</div>
    <div class="toolbar-right">
      <select class="sort-select" id="sortSelect" onchange="sortBy=this.value; renderFiles()">
        <option value="newest">按时间最新</option>
        <option value="oldest">按时间最旧</option>
        <option value="name">按名称 A-Z</option>
        <option value="size">按大小</option>
        <option value="type">按类型</option>
      </select>
      <button class="view-btn active" id="viewGrid" onclick="setView('grid')" title="网格视图">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </button>
      <button class="view-btn" id="viewList" onclick="setView('list')" title="列表视图">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 文件列表 -->
  <div id="fileGrid" class="file-grid"></div>
</div>

<!-- 右键菜单 -->
<div class="context-menu" id="contextMenu">
  <div class="context-item" onclick="ctxAction('open')">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
    </svg>
    打开/预览
  </div>
  <div class="context-item" onclick="ctxAction('download')">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    下载
  </div>
  <div class="context-item" onclick="ctxAction('copy')">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
    复制链接
  </div>
  <div class="context-divider"></div>
  <div class="context-item" onclick="ctxAction('rename')">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
    </svg>
    重命名
  </div>
  <div class="context-divider"></div>
  <div class="context-item danger" onclick="ctxAction('delete')">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
    </svg>
    删除
  </div>
</div>

<!-- 预览面板 -->
<div class="preview-overlay" id="previewOverlay">
  <div class="preview-topbar">
    <div class="preview-title" id="previewTitle">-</div>
    <div class="preview-actions">
      <button class="btn-ghost" onclick="downloadFile(ctxIndex)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        下载
      </button>
      <button class="btn-ghost" onclick="closePreview()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
        关闭
      </button>
    </div>
  </div>
  <div class="preview-body" id="previewBody"></div>
  <div class="preview-info" id="previewInfo"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 隐藏的文件输入 -->
<input type="file" id="fileInput" style="display:none" multiple onchange="handleFiles(this.files)" />

<script>
// ── 数据 ──
const DB_NAME = 'fileLibraryDB';
const STORE_NAME = 'files';
let db = null;
let allFiles = [];
let currentFilter = 'all';
let sortBy = 'newest';
let viewMode = 'grid';
let ctxIndex = -1;
let ctxFile = null;

// ── 初始化 IndexedDB ──
function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = e => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains(STORE_NAME)) {
        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
  });
}

function dbGetAll() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(file) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.put(file);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ── 文件类型判断 ──
function getFileType(file) {
  const t = file.type;
  const name = file.name.toLowerCase();
  if (t.startsWith('image/')) return 'image';
  if (t.startsWith('video/')) return 'video';
  if (t.startsWith('audio/')) return 'audio';
  if (t.match(/word|document|text\/plain|text\/html|text\/xml|pdf/)) return 'doc';
  if (name.endsWith('.zip') || name.endsWith('.rar') || name.endsWith('.7z') || name.endsWith('.tar') || name.endsWith('.gz')) return 'zip';
  return 'other';
}

function getFileIcon(type, ext) {
  const icons = {
    doc: '📄', image: '🖼️', video: '🎬', audio: '🎵', zip: '📦', other: '📎'
  };
  return icons[type] || '📎';
}

function getFileExt(name) {
  return name.split('.').pop().toUpperCase().substring(0, 5);
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
}

// ── 上传处理 ──
function handleFiles(files) {
  if (!files || !files.length) return;
  const zone = document.getElementById('uploadZone');
  const progress = document.getElementById('uploadProgress');
  const fill = document.getElementById('uploadFill');
  const nameEl = document.getElementById('uploadFileName');
  const pctEl = document.getElementById('uploadPercent');

  let completed = 0;
  progress.classList.add('show');

  Array.from(files).forEach((file, i) => {
    const reader = new FileReader();
    reader.onprogress = e => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        fill.style.width = pct + '%';
        nameEl.textContent = file.name;
        pctEl.textContent = pct + '%';
      }
    };
    reader.onload = e => {
      const fileData = {
        id: Date.now() + '-' + Math.random().toString(36).substr(2, 9),
        name: file.name,
        size: file.size,
        type: file.type,
        fileType: getFileType(file),
        data: e.target.result,
        createdAt: Date.now(),
      };
      dbPut(fileData).then(() => {
        allFiles.push(fileData);
        completed++;
        if (completed === files.length) {
          progress.classList.remove('show');
          fill.style.width = '0%';
          renderFiles();
          showToast(`已上传 ${files.length} 个文件`, 'success');
        }
      });
    };
    reader.onerror = () => {
      showToast('上传失败: ' + file.name, 'error');
      completed++;
    };
    reader.readAsDataURL(file);
  });
}

// ── 渲染文件列表 ──
function renderFiles() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  let files = allFiles.filter(f => {
    const matchFilter = currentFilter === 'all' || f.fileType === currentFilter;
    const matchSearch = !query || f.name.toLowerCase().includes(query);
    return matchFilter && matchSearch;
  });

  // 排序
  files.sort((a, b) => {
    switch (sortBy) {
      case 'newest': return b.createdAt - a.createdAt;
      case 'oldest': return a.createdAt - b.createdAt;
      case 'name': return a.name.localeCompare(b.name, 'zh');
      case 'size': return b.size - a.size;
      case 'type': return a.fileType.localeCompare(b.fileType);
      default: return 0;
    }
  });

  const grid = document.getElementById('fileGrid');
  document.getElementById('toolbarInfo').textContent = `共 ${files.length} 个文件`;

  if (files.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <h3>暂无文件</h3>
        <p>点击上方「上传文件」按钮或拖入文件</p>
      </div>`;
    return;
  }

  grid.innerHTML = files.map((f, idx) => {
    const icon = getFileIcon(f.fileType, f.name);
    const ext = getFileExt(f.name);
    const thumb = f.fileType === 'image' && f.data
      ? `<img src="${f.data}" loading="lazy" />`
      : `<span style="font-size:52px">${icon}</span>`;
    const listClass = viewMode === 'list' ? 'list-view' : '';

    return `
    <div class="file-card ${listClass}" data-index="${idx}" onclick="onCardClick(event, ${idx})"
         oncontextmenu="onContextMenu(event, ${idx})">
      <div class="file-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="file-thumb">
        ${thumb}
        <span class="ext-badge">${ext}</span>
        ${f.fileType === 'video' || f.fileType === 'audio' ? '<div class="play-overlay"><span>▶</span></div>' : ''}
      </div>
      <div class="file-info">
        <div class="file-name" title="${f.name}">${f.name}</div>
        <div class="file-meta">
          <span class="file-size">${fmtSize(f.size)}</span>
          <span class="file-date">${fmtDate(f.createdAt)}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  // 更新统计
  updateStats(files);
}

// ── 统计 ──
function updateStats(files) {
  const total = allFiles.length;
  const today = allFiles.filter(f => {
    const d = new Date(f.createdAt);
    const n = new Date();
    return d.toDateString() === n.toDateString();
  }).length;
  const totalSize = allFiles.reduce((s, f) => s + f.size, 0);

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statToday').textContent = today;
  document.getElementById('statSize').textContent = fmtSize(totalSize);

  // 分类计数
  const cats = ['doc','image','video','audio','zip','other'];
  cats.forEach(c => {
    const el = document.getElementById('cnt' + c.charAt(0).toUpperCase() + c.slice(1));
    if (el) el.textContent = allFiles.filter(f => f.fileType === c).length;
  });
  document.getElementById('cntAll').textContent = total;
}

// ── 点击卡片 ──
function onCardClick(e, idx) {
  // 右键单独处理
  if (e.button === 2) return;
  const files = getFilteredFiles();
  if (idx >= 0 && idx < files.length) openPreview(files[idx]);
}

// ── 右键菜单 ──
function onContextMenu(e, idx) {
  e.preventDefault();
  const files = getFilteredFiles();
  ctxIndex = idx;
  ctxFile = files[idx];
  const menu = document.getElementById('contextMenu');
  menu.style.left = Math.min(e.clientX, window.innerWidth - 180) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - 200) + 'px';
  menu.classList.add('show');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.context-menu')) {
    document.getElementById('contextMenu').classList.remove('show');
  }
});

function getFilteredFiles() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  return allFiles.filter(f => {
    const matchFilter = currentFilter === 'all' || f.fileType === currentFilter;
    const matchSearch = !query || f.name.toLowerCase().includes(query);
    return matchFilter && matchSearch;
  });
}

function ctxAction(action) {
  document.getElementById('contextMenu').classList.remove('show');
  if (!ctxFile) return;
  switch (action) {
    case 'open': openPreview(ctxFile); break;
    case 'download': downloadFile(ctxIndex); break;
    case 'copy': copyLink(ctxFile); break;
    case 'rename': renameFile(ctxFile); break;
    case 'delete': deleteFile(ctxFile); break;
  }
}

// ── 打开预览 ──
function openPreview(file) {
  const overlay = document.getElementById('previewOverlay');
  const body = document.getElementById('previewBody');
  document.getElementById('previewTitle').textContent = file.name;
  document.getElementById('previewInfo').innerHTML =
    `<span>大小 <b>${fmtSize(file.size)}</b></span>` +
    `<span>类型 <b>${file.type || '未知'}</b></span>` +
    `<span>上传于 <b>${new Date(file.createdAt).toLocaleString('zh-CN')}</b></span>`;

  body.innerHTML = '';
  ctxFile = file;

  if (file.fileType === 'image') {
    body.innerHTML = `<img src="${file.data}" alt="${file.name}" />`;
  } else if (file.fileType === 'video') {
    body.innerHTML = `<video src="${file.data}" controls autoplay style="max-height:calc(100vh - 140px)"></video>`;
  } else if (file.fileType === 'audio') {
    body.innerHTML = `
      <div style="width:100%;max-width:600px">
        <audio src="${file.data}" controls autoplay style="width:100%"></audio>
        <div style="text-align:center;margin-top:16px;color:var(--muted);font-size:14px">${file.name}</div>
      </div>`;
  } else {
    body.innerHTML = `
      <div class="preview-no-support">
        <p style="font-size:48px;margin-bottom:20px">${getFileIcon(file.fileType)}</p>
        <p><strong>${file.name}</strong></p>
        <p>${fmtSize(file.size)} · ${file.type || '未知类型'}</p>
        <p style="margin-top:20px">此文件类型不支持在线预览</p>
        <button class="btn-primary" style="margin-top:16px" onclick="downloadFile(-1)">
          下载文件查看
        </button>
      </div>`;
  }

  overlay.classList.add('show');
}

function closePreview() {
  document.getElementById('previewOverlay').classList.remove('show');
  document.getElementById('previewBody').innerHTML = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePreview();
});

// ── 下载 ──
function downloadFile(idx) {
  let file;
  if (idx === -1) file = ctxFile;
  else {
    const files = getFilteredFiles();
    file = files[idx];
  }
  if (!file) return;
  const a = document.createElement('a');
  a.href = file.data;
  a.download = file.name;
  a.click();
  showToast('开始下载: ' + file.name, 'success');
}

// ── 复制链接 ──
function copyLink(file) {
  // 本地 data URL 太长，复制文件名提示
  if (navigator.clipboard) {
    navigator.clipboard.writeText(file.name).then(() => {
      showToast('已复制文件名: ' + file.name, 'success');
    });
  }
}

// ── 重命名 ──
function renameFile(file) {
  const newName = prompt('输入新文件名：', file.name);
  if (!newName || newName === file.name) return;
  file.name = newName;
  file.fileType = getFileType({ name: newName, type: file.type });
  dbPut(file).then(() => { renderFiles(); showToast('已重命名', 'success'); });
}

// ── 删除 ──
function deleteFile(file) {
  if (!confirm(`确认删除「${file.name}」？`)) return;
  dbDelete(file.id).then(() => {
    allFiles = allFiles.filter(f => f.id !== file.id);
    renderFiles();
    showToast('已删除: ' + file.name, 'success');
  });
}

// ── 筛选 ──
function setFilter(type, el) {
  currentFilter = type;
  document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderFiles();
}

// ── 视图 ──
function setView(mode) {
  viewMode = mode;
  const grid = document.getElementById('fileGrid');
  grid.classList.toggle('list-view', mode === 'list');
  document.getElementById('viewGrid').classList.toggle('active', mode === 'grid');
  document.getElementById('viewList').classList.toggle('active', mode === 'list');
}

// ── 拖放上传 ──
const uploadZone = document.getElementById('uploadZone');
['dragenter','dragover'].forEach(evt => {
  uploadZone.addEventListener(evt, e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
});
['dragleave','drop'].forEach(evt => {
  uploadZone.addEventListener(evt, e => { e.preventDefault(); uploadZone.classList.remove('dragover'); });
});
uploadZone.addEventListener('drop', e => { handleFiles(e.dataTransfer.files); });
document.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

// ── Toast ──
function showToast(msg, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + type + ' show';
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ── 文件输入 ──
const fileInput = document.getElementById('fileInput');
function triggerUpload() { fileInput.click(); }

// ── 启动 ──
initDB().then(() => {
  return dbGetAll();
}).then(files => {
  allFiles = files;
  renderFiles();
}).catch(err => {
  console.error('DB init error:', err);
  showToast('存储初始化失败', 'error');
});
</script>
</body>
</html>
